<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APRENDO CON LAS REGLETAS</title>
  <style>
    :root {
      /* Estos valores se sobrescriben dinámicamente desde JS */
      --unit: 40px;
      --rod-height: 36px;
      --palette-unit: 14px;

      --header-h: 58px;
      --toolbar-h: 52px;
      --palette-h: 102px;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #3b82f6;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #f0f4f8;
      color: var(--text);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: linear-gradient(160deg, #eef2ff 0%, #f0f9ff 45%, #f8fafc 100%);
    }

    /* Header */
    header {
      height: var(--header-h);
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      z-index: 50;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: clamp(0.95rem, 2.4vw, 1.35rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #1e40af, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* Toolbar */
    .toolbar {
      height: var(--toolbar-h);
      min-height: var(--toolbar-h);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: none;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      background: white;
      color: var(--text);
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(0,0,0,0.11);
    }

    .btn:active { transform: scale(0.96); }

    .btn.active {
      background: var(--accent);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(59,130,246,0.35);
    }

    .btn.danger.active {
      background: var(--danger);
      box-shadow: 0 4px 12px rgba(239,68,68,0.35);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Mural */
    #mural {
      flex: 1;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 28%, rgba(59,130,246,0.05) 0%, transparent 50%),
        radial-gradient(circle at 82% 72%, rgba(139,92,246,0.04) 0%, transparent 45%),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }

    #mural.erase-mode { cursor: crosshair; }

    #mural::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: var(--unit) var(--unit);
      pointer-events: none;
      opacity: 0.5;
    }

    /* Regletas del mural */
    .rod {
      position: absolute;
      height: var(--rod-height);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: calc(var(--unit) * 0.38);
      color: rgba(0,0,0,0.82);
      border: 2.5px solid rgba(0,0,0,0.3);
      box-shadow:
        0 3px 0 rgba(0,0,0,0.18),
        0 5px 12px rgba(0,0,0,0.13),
        inset 0 1px 0 rgba(255,255,255,0.5);
      cursor: grab;
      touch-action: none;
      transition: box-shadow 0.15s ease, transform 0.1s ease;
      z-index: 10;
      will-change: left, top;
    }

    .rod:active,
    .rod.dragging {
      cursor: grabbing;
      box-shadow:
        0 7px 0 rgba(0,0,0,0.2),
        0 14px 26px rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.55);
      transform: scale(1.04);
      z-index: 100;
      border-color: rgba(0,0,0,0.42);
    }

    .rod .num {
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      transition: opacity 0.2s;
    }

    .rod.hide-num .num { opacity: 0; }

    /* Colores Cuisenaire */
    .rod[data-val="1"],  .palette-rod[data-val="1"]  { background: linear-gradient(180deg,#ffffff,#f1f5f9); color:#334155; border-color:#94a3b8; }
    .rod[data-val="2"],  .palette-rod[data-val="2"]  { background: linear-gradient(180deg,#f87171,#dc2626); color:#fff; }
    .rod[data-val="3"],  .palette-rod[data-val="3"]  { background: linear-gradient(180deg,#bbf7d0,#4ade80); color:#14532d; }
    .rod[data-val="4"],  .palette-rod[data-val="4"]  { background: linear-gradient(180deg,#f9a8d4,#ec4899); color:#fff; }
    .rod[data-val="5"],  .palette-rod[data-val="5"]  { background: linear-gradient(180deg,#fef08a,#eab308); color:#713f12; }
    .rod[data-val="6"],  .palette-rod[data-val="6"]  { background: linear-gradient(180deg,#16a34a,#166534); color:#fff; }
    .rod[data-val="7"],  .palette-rod[data-val="7"]  { background: linear-gradient(180deg,#475569,#0f172a); color:#fff; }
    .rod[data-val="8"],  .palette-rod[data-val="8"]  { background: linear-gradient(180deg,#a16207,#78350f); color:#fff; }
    .rod[data-val="9"],  .palette-rod[data-val="9"]  { background: linear-gradient(180deg,#60a5fa,#1d4ed8); color:#fff; }
    .rod[data-val="10"], .palette-rod[data-val="10"] { background: linear-gradient(180deg,#fb923c,#c2410c); color:#fff; }

    /* ===== PALETA INFERIOR – optimizada para móviles ===== */
    .palette {
      height: var(--palette-h);
      min-height: var(--palette-h);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(0,0,0,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(3px, 1.1vw, 9px);
      padding: 8px 8px 12px;
      flex-shrink: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
      z-index: 40;
    }
    .palette::-webkit-scrollbar { display: none; }

    .palette-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.14s ease;
      flex-shrink: 0;
    }

    .palette-item:active { transform: scale(0.93); }

    .palette-rod {
      height: calc(var(--palette-unit) * 2.45);
      border-radius: 5px;
      border: 2px solid rgba(0,0,0,0.22);
      box-shadow:
        0 2px 0 rgba(0,0,0,0.14),
        0 3px 7px rgba(0,0,0,0.1),
        inset 0 1px 0 rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: calc(var(--palette-unit) * 1.1);
    }

    .palette-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
    }

    /* Hint */
    .hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--muted);
      pointer-events: none;
      opacity: 0.7;
      transition: opacity 0.3s;
      max-width: 92%;
      padding: 0 12px;
    }
    .hint.hidden { opacity: 0; }
    .hint h2 {
      font-size: clamp(1.05rem, 3vw, 1.5rem);
      font-weight: 700;
      margin-bottom: 6px;
      color: #475569;
    }
    .hint p {
      font-size: clamp(0.82rem, 2.1vw, 1.05rem);
      line-height: 1.4;
    }

    /* ===== MEDIA QUERIES MÓVILES ===== */
    @media (max-width: 600px) {
      :root {
        --header-h: 50px;
        --toolbar-h: 46px;
        --palette-h: 92px;
      }
      .btn span { display: none; }
      .btn { padding: 8px 10px; }
      h1 { font-size: 0.92rem; }
      .subtitle { display: none; }
      .palette {
        justify-content: flex-start; /* permite scroll suave si hace falta */
        padding-left: 10px;
        padding-right: 10px;
        gap: 6px;
      }
    }

    @media (max-width: 400px) {
      :root {
        --palette-h: 86px;
      }
      .palette {
        gap: 5px;
      }
    }

    @media (orientation: landscape) and (max-height: 480px) {
      :root {
        --header-h: 44px;
        --toolbar-h: 42px;
        --palette-h: 78px;
      }
      .subtitle { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <div class="logo-icon">R</div>
        <div>
          <h1>APRENDO CON LAS REGLETAS</h1>
          <div class="subtitle">Forma muros de números · Cuisenaire</div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <button class="btn" id="btnFullscreen" title="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span>Pantalla completa</span>
      </button>
      <button class="btn" id="btnToggleNum" title="Mostrar / ocultar números">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16M4 12h10M4 17h14"/></svg>
        <span>Números</span>
      </button>
      <button class="btn" id="btnErase" title="Modo borrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
        <span>Borrar</span>
      </button>
      <button class="btn" id="btnReset" title="Reiniciar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reiniciar</span>
      </button>
    </div>

    <div id="mural">
      <div class="hint" id="hint">
        <h2>¡Empieza a construir!</h2>
        <p>Toca una regleta abajo para añadirla al mural.<br>
        Arrástrala libremente y forma muros de números.</p>
      </div>
    </div>

    <div class="palette" id="palette"></div>
  </div>

  <script>
    (function () {
      const COLORS = {
        1: 'Blanca', 2: 'Roja', 3: 'Verde claro', 4: 'Rosa',
        5: 'Amarilla', 6: 'Verde oscuro', 7: 'Negra',
        8: 'Marrón', 9: 'Azul', 10: 'Naranja'
      };

      const mural = document.getElementById('mural');
      const palette = document.getElementById('palette');
      const hint = document.getElementById('hint');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const btnToggleNum = document.getElementById('btnToggleNum');
      const btnErase = document.getElementById('btnErase');
      const btnReset = document.getElementById('btnReset');

      let showNumbers = true;
      let eraseMode = false;
      let rodIdCounter = 0;
      let activePointer = null;
      let dragOffset = { x: 0, y: 0 };
      let currentRod = null;

      // ---------- TAMAÑO INTELIGENTE ----------
      function calculateIdealUnit() {
        const rect = mural.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;

        // Queremos que la regleta del 10 ocupe aprox. el 55-65% del ancho
        // y que la altura de la regleta sea cómoda (entre 28px y 52px)
        let unitByWidth = (w * 0.60) / 10;          // 10 unidades = 60% del ancho
        let unitByHeight = h * 0.11;                // altura ~11% de la altura del mural

        // Límites de seguridad
        unitByWidth = Math.max(22, Math.min(unitByWidth, 58));
        unitByHeight = Math.max(26, Math.min(unitByHeight, 50));

        // Elegimos el menor de los dos para que quepa bien
        let unit = Math.min(unitByWidth, unitByHeight);

        // En pantallas muy estrechas (móviles) reducimos un poco más
        if (w < 500) unit = Math.min(unit, 32);
        if (w < 380) unit = Math.min(unit, 28);

        return Math.round(unit * 10) / 10;
      }

      function updateUnitSize() {
        const unit = calculateIdealUnit();
        document.documentElement.style.setProperty('--unit', unit + 'px');
        document.documentElement.style.setProperty('--rod-height', (unit * 0.9) + 'px');

        // Actualizar todas las regletas existentes
        document.querySelectorAll('.rod').forEach(rod => {
          const val = parseInt(rod.dataset.val, 10);
          rod.style.width = (unit * val * 0.9) + 'px';
        });
      }

      // ---------- PALETA ----------
      function buildPalette() {
        palette.innerHTML = '';
        for (let v = 1; v <= 10; v++) {
          const item = document.createElement('div');
          item.className = 'palette-item';
          item.title = COLORS[v] + ' (' + v + ')';

          const rod = document.createElement('div');
          rod.className = 'palette-rod';
          rod.dataset.val = v;
          rod.style.width = `calc(var(--palette-unit) * ${v} * 1.5)`;
          rod.innerHTML = `<span>${v}</span>`;

          const label = document.createElement('div');
          label.className = 'palette-label';
          label.textContent = v;

          item.appendChild(rod);
          item.appendChild(label);
          item.addEventListener('pointerdown', e => {
            e.preventDefault();
            addRod(v);
          });
          palette.appendChild(item);
        }
      }

      // Ajuste de la unidad de la paleta según el ancho disponible
      function updatePaletteUnit() {
        const available = palette.clientWidth - 20;
        // Suma de longitudes relativas: 1+2+...+10 = 55
        // + gaps aproximados
        const ideal = available / (55 * 1.5 + 9 * 8);
        const pUnit = Math.max(9, Math.min(ideal, 18));
        document.documentElement.style.setProperty('--palette-unit', pUnit + 'px');
      }

      // ---------- REGLETAS ----------
      function addRod(value) {
        const unit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--unit'));
        const width = unit * value * 0.9;

        const rod = document.createElement('div');
        rod.className = 'rod' + (showNumbers ? '' : ' hide-num');
        rod.dataset.val = value;
        rod.dataset.id = ++rodIdCounter;
        rod.style.width = width + 'px';
        rod.innerHTML = `<span class="num">${value}</span>`;

        const muralRect = mural.getBoundingClientRect();
        const startX = (muralRect.width / 2) - (width / 2) + (Math.random() * 40 - 20);
        const startY = (muralRect.height / 2) - (unit * 0.45) + (Math.random() * 50 - 25);

        rod.style.left = Math.max(4, Math.min(startX, muralRect.width - width - 4)) + 'px';
        rod.style.top  = Math.max(4, Math.min(startY, muralRect.height - unit * 0.9 - 4)) + 'px';

        mural.appendChild(rod);
        hint.classList.add('hidden');
        rod.addEventListener('pointerdown', onRodPointerDown);
      }

      function onRodPointerDown(e) {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        e.preventDefault();
        e.stopPropagation();

        const rod = e.currentTarget;

        if (eraseMode) {
          rod.remove();
          if (!mural.querySelector('.rod')) hint.classList.remove('hidden');
          return;
        }

        currentRod = rod;
        rod.classList.add('dragging');
        rod.setPointerCapture(e.pointerId);
        activePointer = e.pointerId;

        const rect = rod.getBoundingClientRect();
        dragOffset.x = e.clientX - rect.left;
        dragOffset.y = e.clientY - rect.top;
        rod.style.zIndex = 200;
      }

      function onPointerMove(e) {
        if (!currentRod || e.pointerId !== activePointer) return;
        e.preventDefault();

        const muralRect = mural.getBoundingClientRect();
        const unit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--unit'));
        const height = unit * 0.9;
        const width = parseFloat(currentRod.style.width);

        let x = e.clientX - muralRect.left - dragOffset.x;
        let y = e.clientY - muralRect.top - dragOffset.y;

        x = Math.max(-width * 0.3, Math.min(x, muralRect.width - width * 0.7));
        y = Math.max(-height * 0.3, Math.min(y, muralRect.height - height * 0.7));

        currentRod.style.left = x + 'px';
        currentRod.style.top = y + 'px';
      }

      function onPointerUp(e) {
        if (!currentRod || e.pointerId !== activePointer) return;
        currentRod.classList.remove('dragging');
        currentRod.style.zIndex = 10;
        try { currentRod.releasePointerCapture(e.pointerId); } catch (_) {}
        currentRod = null;
        activePointer = null;
      }

      mural.addEventListener('pointermove', onPointerMove, { passive: false });
      mural.addEventListener('pointerup', onPointerUp);
      mural.addEventListener('pointercancel', onPointerUp);

      // Botones
      btnToggleNum.addEventListener('click', () => {
        showNumbers = !showNumbers;
        btnToggleNum.classList.toggle('active', showNumbers);
        document.querySelectorAll('.rod').forEach(r => r.classList.toggle('hide-num', !showNumbers));
      });
      btnToggleNum.classList.add('active');

      btnErase.addEventListener('click', () => {
        eraseMode = !eraseMode;
        btnErase.classList.toggle('active', eraseMode);
        btnErase.classList.toggle('danger', eraseMode);
        mural.classList.toggle('erase-mode', eraseMode);
      });

      btnReset.addEventListener('click', () => {
        if (confirm('¿Borrar todas las regletas del mural?')) {
          mural.querySelectorAll('.rod').forEach(r => r.remove());
          hint.classList.remove('hidden');
          eraseMode = false;
          btnErase.classList.remove('active', 'danger');
          mural.classList.remove('erase-mode');
        }
      });

      btnFullscreen.addEventListener('click', () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      });

      // ---------- INICIALIZACIÓN Y RESIZE ----------
      function onResize() {
        updateUnitSize();
        updatePaletteUnit();
      }

      // Esperamos a que el layout esté listo
      window.addEventListener('load', () => {
        buildPalette();
        onResize();
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(onResize, 60);
      });

      // También al cambiar orientación
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 150);
      });

      document.addEventListener('contextmenu', e => e.preventDefault());
    })();
  </script>
</body>
</html>
